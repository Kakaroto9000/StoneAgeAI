[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stoneage-ai"
version = "0.1.0"
description = "Stone Age board game engine with a DQN self-play agent"
requires-python = ">=3.10"
dependencies = ["numpy", "torch", "fastapi", "uvicorn"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"stoneage_ai.web" = ["static/*"]
